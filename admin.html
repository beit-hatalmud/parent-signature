<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>בונה טפסים — אישורי הורים</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700&display=swap" rel="stylesheet">
<style>
body{font-family:'Heebo',sans-serif;background:linear-gradient(135deg,#f8fafc 0%,#e0f2fe 100%);min-height:100vh;padding:20px;color:#1f2937}
.card{border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,0.08);border:none;max-width:900px;margin:30px auto;background:#fff}
h1{color:#0066cc;font-size:1.8rem}
h2{color:#0066cc;font-size:1.2rem;border-bottom:2px solid #e5e7eb;padding-bottom:8px;margin-top:20px}
.template-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.template-btn{padding:14px;border:2px solid #e5e7eb;border-radius:10px;cursor:pointer;text-align:center;transition:.2s;background:#fff}
.template-btn:hover{border-color:#0066cc}
.template-btn.active{background:#0066cc;color:#fff;border-color:#0066cc}
.share-box{background:#f0f9ff;border:2px solid #0066cc;border-radius:12px;padding:20px;margin-top:20px;display:none}
.share-box.show{display:block}
.share-url{background:#fff;padding:10px;border-radius:6px;font-family:monospace;font-size:.85rem;word-break:break-all;direction:ltr;text-align:left}
.btn-primary{background:#0066cc;border-color:#0066cc;font-weight:500}
.btn-success{font-weight:500}
.action-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:15px}
</style>
</head>
<body>
<div class="card p-4">
  <h1 class="text-center"><i class="bi bi-pencil-square"></i> בונה טפסים לאישורי הורים</h1>
  <p class="text-muted text-center">צור טופס מותאם, ערוך שדות מראש, וקבל קישור לשליחה להורים</p>

  <h2>1. בחר סוג טופס</h2>
  <div id="template-grid" class="template-grid"></div>

  <div id="customize" class="d-none">
    <h2>2. מלא ערכים מראש (אופציונלי)</h2>
    <p class="text-muted small">השדות שתמלא יופיעו מראש בטופס. ההורה יוכל לערוך אותם לפני החתימה.</p>
    <div id="custom-fields"></div>

    <h2>3. הגדרות נוספות</h2>
    <div class="row g-2">
      <div class="col-md-6">
        <label class="form-label small">מזהה (יופיע בכותרת המייל)</label>
        <input id="ref" class="form-control" placeholder="לדוגמה: טיול ל ג בעומר תשפו">
      </div>
      <div class="col-md-6">
        <label class="form-label small">שלח חתימה למייל</label>
        <input id="recipient" class="form-control" value="6742853@gmail.com">
      </div>
    </div>

    <div class="action-grid">
      <button class="btn btn-primary" onclick="generateLink()"><i class="bi bi-link-45deg"></i> צור קישור</button>
      <button class="btn btn-success" onclick="openInGmail()"><i class="bi bi-envelope"></i> צור טיוטת מייל</button>
      <button class="btn btn-outline-info" onclick="previewForm()"><i class="bi bi-eye"></i> תצוגה מקדימה</button>
    </div>

    <div id="share-box" class="share-box">
      <h5><i class="bi bi-link-45deg"></i> הקישור מוכן</h5>
      <div class="share-url" id="share-url"></div>
      <div class="d-flex gap-2 mt-3">
        <button class="btn btn-outline-primary btn-sm" onclick="copyLink()"><i class="bi bi-clipboard"></i> העתק</button>
        <a id="open-link" class="btn btn-outline-success btn-sm" target="_blank"><i class="bi bi-box-arrow-up-right"></i> פתח טופס</a>
        <button class="btn btn-outline-info btn-sm" onclick="shareWhatsapp()"><i class="bi bi-whatsapp"></i> WhatsApp</button>
        <button class="btn btn-outline-secondary btn-sm" onclick="shareSms()"><i class="bi bi-chat"></i> SMS</button>
      </div>
    </div>
  </div>
</div>

<script src="forms.js"></script>
<script>
let currentTpl = null;

function init() {
  const grid = document.getElementById('template-grid');
  const tplIcons = {trip:'🚌',photo:'📷',medical:'🏥',general:'📄',payment:'💰',emergency:'☎️'};
  for (const key in FORMS) {
    const f = FORMS[key];
    grid.innerHTML += `<div class="template-btn" data-key="${key}" onclick="selectTpl('${key}')">
      <div style="font-size:2rem">${tplIcons[key]||'📋'}</div>
      <div class="mt-2"><strong>${f.title}</strong></div>
    </div>`;
  }
}

function selectTpl(key) {
  currentTpl = key;
  document.querySelectorAll('.template-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.getElementById('customize').classList.remove('d-none');
  const f = FORMS[key];
  const cf = document.getElementById('custom-fields');
  cf.innerHTML = f.fields.filter(fld => fld.type !== 'checkbox').map(fld => `
    <div class="mb-2">
      <label class="form-label small">${fld.label}</label>
      <input id="pre-${fld.id}" class="form-control form-control-sm" type="${fld.type==='textarea'?'text':fld.type||'text'}">
    </div>
  `).join('');
  document.getElementById('share-box').classList.remove('show');
}

function buildUrl() {
  const f = FORMS[currentTpl];
  const params = new URLSearchParams({tpl: currentTpl});
  f.fields.forEach(fld => {
    const el = document.getElementById('pre-' + fld.id);
    if (el && el.value) params.set(fld.id, el.value);
  });
  const ref = document.getElementById('ref').value.trim();
  const to = document.getElementById('recipient').value.trim();
  if (ref) params.set('ref', ref);
  if (to) params.set('to', to);
  return location.origin + location.pathname.replace(/admin\.html$/,'') + 'index.html?' + params.toString();
}

function generateLink() {
  if (!currentTpl) return alert('בחר סוג טופס');
  const url = buildUrl();
  document.getElementById('share-url').textContent = url;
  document.getElementById('open-link').href = url;
  document.getElementById('share-box').classList.add('show');
  document.getElementById('share-box').scrollIntoView({behavior:'smooth'});
}

function copyLink() {
  navigator.clipboard.writeText(document.getElementById('share-url').textContent);
  alert('הקישור הועתק!');
}

function shareWhatsapp() {
  const url = document.getElementById('share-url').textContent;
  const f = FORMS[currentTpl];
  const txt = encodeURIComponent(`${f.title}\n${url}`);
  window.open('https://wa.me/?text=' + txt, '_blank');
}

function shareSms() {
  const url = document.getElementById('share-url').textContent;
  const f = FORMS[currentTpl];
  window.open(`sms:?body=${encodeURIComponent(f.title + ' ' + url)}`);
}

function previewForm() {
  generateLink();
  window.open(document.getElementById('share-url').textContent, '_blank');
}

function openInGmail() {
  if (!currentTpl) return alert('בחר סוג טופס');
  const url = buildUrl();
  const f = FORMS[currentTpl];
  const ref = document.getElementById('ref').value.trim();
  const subject = encodeURIComponent(f.title + (ref ? ' — ' + ref : ''));
  const body = encodeURIComponent(`שלום,

אנא מלא את הטופס הבא וחתום:

${f.title}
${ref ? 'מזהה: ' + ref + '\n' : ''}
לחץ כאן למילוי וחתימה:
${url}

לאחר החתימה, התעודה תישלח אוטומטית למוסד.

תודה,
בית התלמוד`);
  window.open(`https://mail.google.com/mail/?view=cm&fs=1&su=${subject}&body=${body}`, '_blank');
}

init();
</script>
</body>
</html>
